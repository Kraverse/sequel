name: Daily 10 Commits

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make 10 commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in {1..10}; do
            echo "Commit $i - $(date -u)" >> activity.txt
            git add activity.txt
            git commit -m "chore: daily activity $i"
            git push
          done
